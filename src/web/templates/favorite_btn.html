<span id="fav-btn-{{ code }}">
<button hx-post="/videos/{{ code }}/favorite"
        hx-target="#fav-btn-{{ code }}"
        hx-swap="outerHTML"
        style="background:none;border:none;cursor:pointer;font-size:1.2rem;padding:0.15rem 0.25rem;line-height:1;transition:color 0.2s;{% if is_favorited %}color:#EC4899;{% else %}color:#94A3B8;{% endif %}"
        title="{% if is_favorited %}Remove favorite{% else %}Add favorite{% endif %}">{% if is_favorited %}★{% else %}☆{% endif %}</button>
</span>
