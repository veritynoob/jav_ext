<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAV Panel - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #121212;
            --surface-raised: #181818;
            --fg: #e6e0d6;
            --fg-muted: #8a8278;
            --fg-dim: #504a42;
            --accent: #d4a24c;
            --accent-hover: #e0b45e;
            --accent-glow: rgba(212,162,76,0.12);
            --border: rgba(255,255,255,0.05);
            --border-visible: rgba(255,255,255,0.09);
            --destructive: #c4553a;
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 10px;
            --font-display: 'Cormorant Garamond', 'Noto Serif SC', serif;
            --font-body: 'Work Sans', 'Noto Sans SC', system-ui, sans-serif;
            color-scheme: dark;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        body {
            font-family: var(--font-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg);
            color: var(--fg);
        }
        .login-card {
            width: 380px;
            padding: 2.25rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
        }
        .login-card h2 {
            font-family: var(--font-display);
            font-size: 1.75rem;
            text-align: center;
            color: var(--fg);
            margin-bottom: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        label {
            display: block;
            color: var(--fg-muted);
            font-size: 0.82rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
        }
        input {
            display: block;
            width: 100%;
            margin-top: 0.3rem;
            padding: 0.55rem 0.7rem;
            background: var(--bg);
            color: var(--fg);
            border: 1px solid var(--border-visible);
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 180ms ease, box-shadow 180ms ease;
        }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        button {
            width: 100%;
            padding: 0.55rem 1rem;
            background: var(--accent);
            color: #0a0a0a;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 180ms ease;
            margin-top: 0.25rem;
        }
        button:hover { background: var(--accent-hover); }
        .error-msg {
            color: var(--destructive);
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>JAV</h2>
        {% if error %}
        <p class="error-msg">{{ error }}</p>
        {% endif %}
        <form method="post">
            <label>Password <input type="password" name="password" required autofocus></label>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
