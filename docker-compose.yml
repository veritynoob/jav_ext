services:
  scraper:
    build: .
    volumes:
      - ./data:/app/data
      - ./covers:/app/covers
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - JAV_PROXY=http://host.docker.internal:7897
      - JAV_WAIT_DELAY=40
    restart: "no"

  test:
    build: .
    profiles: ["test"]
    command: python -m pytest tests/ -v
    volumes:
      - ./data:/app/data
